name: peng_cafe
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter

  
  cupertino_icons: ^1.0.8
  drift: ^2.30.1
  drift_flutter: ^0.2.8
  path_provider: ^2.1.5
  get_it: ^9.2.0
  flutter_screenutil: ^5.9.3
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  go_router: ^17.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_animate: ^4.5.2
  animated_theme_switcher: ^2.0.10
  easy_localization: ^3.0.8
  shared_preferences: ^2.5.4
  dropdown_button2: ^2.3.9
  floating_action_bubble: ^1.1.4
  flutter_svg: ^2.2.3
  connectivity_plus: ^7.0.0
  fl_chart: ^1.1.1
  lottie: ^3.3.2
  animated_emoji: ^3.2.1
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  glass: ^2.0.0+2
  cached_network_image: ^3.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  drift_dev: ^2.30.1
  build_runner: ^2.10.5
  freezed: ^3.2.4
  json_serializable: ^6.11.4

flutter:

 
  uses-material-design: true

  assets:
    
    - assets/translations/
    - assets/lotties/
    - assets/images/
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Mirza
      fonts:
        - asset: assets/fonts/Mirza-Regular.ttf
        - asset: assets/fonts/Mirza-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mirza-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mirza-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Italic.ttf
          weight: 500
        - asset: assets/fonts/Amiri-BoldItalic.ttf
          weight: 600
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
